<ion-card class="aviso-card">
  <div class="card-ribbon">AVISO</div>
  <img *ngIf="aviso?.imagen" [src]="aviso.imagen" alt="Foto del aviso" class="aviso-image" (click)="abrirImagen()" />
  <ion-card-header>
    <ion-card-title>{{ aviso?.titulo }}</ion-card-title>
    <ion-card-subtitle>{{ aviso?.fecha | fecha }}</ion-card-subtitle>
    <p class="timestamp">{{ getFechaHora() }}</p>
  </ion-card-header>

  <ion-card-content>
    <p class="description">{{ aviso?.descripcion }}</p>
  </ion-card-content>

  <ion-item lines="none" class="actions-row">
    <ion-buttons slot="end">
      <ion-button class="action-button edit-btn" fill="clear" (click)="editarAviso()">
        <span class="action-content">
          <svg viewBox="0 0 24 24" class="action-icon" aria-hidden="true">
            <path d="M12 20h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19.5 3 21l1.5-4L16.5 3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
          </svg>
          <span class="action-label">Editar</span>
        </span>
      </ion-button>
      <ion-button class="action-button delete-btn" fill="clear" (click)="confirmarEliminacion()">
        <span class="action-content">
          <svg viewBox="0 0 24 24" class="action-icon" aria-hidden="true">
            <path d="M4 7h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            <path d="M9 7V4h6v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M8 7l1 12h6l1-12" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
            <path d="M10 10v6M14 10v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          <span class="action-label">Eliminar</span>
        </span>
      </ion-button>
    </ion-buttons>
  </ion-item>
</ion-card>
