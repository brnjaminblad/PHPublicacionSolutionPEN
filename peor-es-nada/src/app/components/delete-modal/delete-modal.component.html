<ion-header>
  <ion-toolbar>
    <ion-title>Confirmar eliminación</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p>¿Deseas eliminar el aviso <strong>{{ aviso?.titulo }}</strong>?</p>
  <ion-button expand="block" color="danger" (click)="confirmar()">Sí, eliminar</ion-button>
  <ion-button expand="block" fill="clear" (click)="cancelar()">Cancelar</ion-button>
</ion-content>
