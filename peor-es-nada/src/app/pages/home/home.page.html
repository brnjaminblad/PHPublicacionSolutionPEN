<ion-header [translucent]="true">
  <ion-toolbar class="home-toolbar-header">
    <ion-title class="community-title">Avisos Comunidad "Peor es Nada"</ion-title>
    <ion-buttons slot="end">
      <div class="sort-control" (click)="cambiarOrden()">
        <span class="sort-label">{{ orden === 'asc' ? 'Menor a mayor' : 'Mayor a menor' }}</span>
        <ion-button fill="clear" color="warning" class="sort-button" aria-label="Cambiar orden">
          <img src="assets/icons/ascending-sort.svg" alt="Ordenar" class="sort-icon" />
        </ion-button>
      </div>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding home-page">
  <app-aviso-list
    [avisos]="avisos"
    (eliminarAviso)="abrirModalEliminar($event)"
    (editarAviso)="abrirModalEditar($event)"
  ></app-aviso-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/crear-aviso" class="fab-add">
      <svg viewBox="0 0 24 24" class="fab-icon" aria-hidden="true">
        <path d="M12 3v18M3 12h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </ion-fab-button>
  </ion-fab>
</ion-content>
